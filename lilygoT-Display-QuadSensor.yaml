# ESPHome: use current stable; last verified on 2026.7.3 (see README).
substitutions:
  # Forkers: change labels and Home Assistant entity IDs for each row
  label_1: "Main Fridge"
  entity_1: sensor.main_fridge_a290_temperature
  label_2: "Main Freezer"
  entity_2: sensor.main_freezer_temperature
  label_3: "Kitchen"
  entity_3: sensor.kitchen_temperature
  label_4: "Office"
  entity_4: sensor.office_temperature
  # Timer / button / low-battery sleep length (e.g. "12h" for more frequent check-ins)
  deep_sleep_duration: "24h"

esphome:
  name: tdisplay-quad-sensor
  friendly_name: T-Display Quad Sensor
  on_boot:
    - priority: 600
      then:
        # Classify wake: button (ignore release), timer (silent check-in), else interactive
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            id(ignore_button_release) =
                (cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1);
            id(timer_wake) = (cause == ESP_SLEEP_WAKEUP_TIMER);
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return id(timer_wake);'
            then:
              - script.execute: timer_checkin_script
            else:
              # Interactive: button wake or cold boot — stay awake until sleep button
              - output.turn_on: backlight_gpio
              # First ADC sample is otherwise delayed by update_interval (~60–120s)
              - delay: 2s
              - component.update: vcc
              - delay: 500ms
              - binary_sensor.template.publish:
                  id: usb_power_present
                  state: !lambda 'return id(vcc).has_state() && id(vcc).state > 4.25;'
              - component.update: batterylevel

esp32:
  board: esp32dev
  framework:
    type: arduino
    # Optional — leave commented for max board compatibility (older ESP32 silicon /
    # bootloaders). Wrong values can prevent boot. Enable only when YOUR boot logs say:
    #   "Chip rev >= 3.0 detected…"  → uncomment minimum_chip_revision
    #   "Bootloader supports SRAM1 as IRAM…" → uncomment sram1_as_iram (USB flash once first)
    # Prefer adding these in your adopted/local overlay rather than editing the package.
    # advanced:
    #   minimum_chip_revision: "3.1"
    #   sram1_as_iram: true

logger:
  level: WARN

# Enable Home Assistant API (open for prebuilt Web Tools flashing; add encryption locally if desired)
api:

# OTA is required for Over-the-Air updating (open for prebuilt; add password locally if desired)
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fallback_AP"

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Commenting out web server in case it causes more battery consumption
# web_server:
#   port: 80
#   include_internal: true

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

# Backlight (was backlight_pin on st7789v; mipi_spi does not drive it)
output:
  - platform: gpio
    pin: GPIO4
    id: backlight_gpio

font:
  - file: "fonts/arial_11.bdf"
    id: tiny_font

  - file: "fonts/arial_16.bdf"
    id: small_font

  - file: "fonts/arial_24.bdf"
    id: medium_font

  # U+26A1 (⚡): not in arial_*.bdf; Arial.ttf also omits this glyph. Noto Sans Symbols 2 (OFL).
  - file: "fonts/NotoSansSymbols2-Regular.ttf"
    id: bolt_font
    size: 16
    glyphs: "⚡"

# Debounce so low-battery sleep is only armed once per wake cycle
globals:
  - id: last_low_battery_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: ignore_button_release
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: timer_wake
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: homeassistant
    name: "${label_1} Temperature"
    entity_id: ${entity_1}
    id: sensor_1
    unit_of_measurement: 'F'

  - platform: homeassistant
    name: "${label_2} Temperature"
    entity_id: ${entity_2}
    id: sensor_2
    unit_of_measurement: 'F'

  - platform: homeassistant
    name: "${label_3} Temperature"
    entity_id: ${entity_3}
    id: sensor_3
    unit_of_measurement: 'F'

  - platform: homeassistant
    name: "${label_4} Temperature"
    entity_id: ${entity_4}
    id: sensor_4
    unit_of_measurement: 'F'

  - platform: adc
    pin: GPIO34
    attenuation: auto
    name: VBatt
    id: vcc
    update_interval: 60s
    filters:
      - multiply: 2  # Adjust for the voltage divider 2.02695
    on_value:
      then:
        - binary_sensor.template.publish:
            id: usb_power_present
            state: !lambda 'return x > 4.25;'
        - component.update: batterylevel

  - platform: internal_temperature
    name: "Internal Temperature"

  - platform: template
    name: "Lilygo T-Display Battery Level"
    id: batterylevel
    unit_of_measurement: '%'
    device_class: battery
    update_interval: 60s
    lambda: |-
      if (!id(vcc).has_state()) {
        return {};
      }

      float voltage = id(vcc).state;

      // Clamp USB-powered readings for % only (USB detect uses raw VBatt)
      if (voltage > 4.2) voltage = 4.2;
      if (voltage < 3.0) voltage = 3.0;

      float percentage = 0.0;

      if (voltage >= 4.15) percentage = 100;
      else if (voltage >= 4.05) percentage = 90;
      else if (voltage >= 3.95) percentage = 80;
      else if (voltage >= 3.85) percentage = 70;
      else if (voltage >= 3.80) percentage = 60;
      else if (voltage >= 3.75) percentage = 50;
      else if (voltage >= 3.70) percentage = 40;
      else if (voltage >= 3.65) percentage = 30;
      else if (voltage >= 3.55) percentage = 20;
      else if (voltage >= 3.40) percentage = 10;
      else percentage = 5;

      // Do NOT arm sleep if USB is present (threshold tuned for T-Display charge bump).
      // Skip during timer check-in — that path re-sleeps itself after the OTA window.
      if (!id(timer_wake) &&
          !id(usb_power_present).state &&
          percentage < 30 &&
          id(last_low_battery_time) == 0) {
        id(last_low_battery_time) = millis();
        id(low_battery_script).execute();
      }

      return percentage;

# Recoverable deep sleep: timer check-in + button (GPIO35) can wake.
deep_sleep:
  id: deep_sleep_config
  sleep_duration: ${deep_sleep_duration}
  wakeup_pin:
    number: GPIO35
    inverted: true
    mode: INPUT
    allow_other_uses: true
  # Wake on button LOW. Enter sleep only after release so the pin is HIGH and
  # does not immediately trip EXT0 (on_press + IGNORE caused blink-awake).
  wakeup_pin_mode: IGNORE

script:
  # Silent timer wake: publish battery, linger for queued OTA, re-sleep (no backlight).
  - id: timer_checkin_script
    mode: single
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - wait_until:
          condition:
            api.connected:
          timeout: 30s
      - component.update: vcc
      - delay: 500ms
      - binary_sensor.template.publish:
          id: usb_power_present
          state: !lambda 'return id(vcc).has_state() && id(vcc).state > 4.25;'
      - component.update: batterylevel
      # Window for Device Builder queued offline OTA to start/finish
      - delay: 2min
      - deep_sleep.enter:
          id: deep_sleep_config
          sleep_duration: ${deep_sleep_duration}

  - id: low_battery_script
    mode: restart
    then:
      - delay: 3min
      # Re-check USB after the wait — plug-in during the delay cancels sleep
      - if:
          condition:
            lambda: 'return !id(usb_power_present).state;'
          then:
            - deep_sleep.enter:
                id: deep_sleep_config
                sleep_duration: ${deep_sleep_duration}

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT
      inverted: true
      allow_other_uses: true
    name: "Sleep Button 1"
    id: sleep_button
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    # Sleep after release so GPIO35 is inactive before EXT0 is armed.
    # Skip the first release after a button wake (that release is still the wake press).
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(ignore_button_release);'
            then:
              - lambda: 'id(ignore_button_release) = false;'
            else:
              - delay: 200ms
              - deep_sleep.enter:
                  id: deep_sleep_config
                  sleep_duration: ${deep_sleep_duration}

  # Published from ADC on_value / on_boot (not a PollingComponent)
  - platform: template
    name: "USB Power Present"
    id: usb_power_present
    internal: true

color:
  - id: color_green
    green: 100%

  - id: color_red
    red: 100%

  - id: color_yellow
    red: 100%
    green: 100%

display:
  - platform: mipi_spi
    model: T-DISPLAY
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    rotation: 0

    lambda: |-
      it.fill(Color::BLACK);

      int y_offset = 18;  // Starting Y position
      int spacing = 57;   // Vertical spacing between entities
      int line_spacing = 1; // Additional space between the temperature value and the horizontal line

      it.printf(2, y_offset, id(small_font), id(color_green), "${label_1}:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(sensor_1).state);
      it.horizontal_line(0, y_offset + spacing + line_spacing, 240, Color::WHITE);

      y_offset += spacing;
      it.printf(2, y_offset, id(small_font), id(color_green), "${label_2}:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(sensor_2).state);
      it.horizontal_line(0, y_offset + spacing + line_spacing, 240, Color::WHITE);

      y_offset += spacing;
      it.printf(2, y_offset, id(small_font), id(color_green), "${label_3}:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(sensor_3).state);
      it.horizontal_line(0, y_offset + spacing + line_spacing, 240, Color::WHITE);

      y_offset += spacing;
      it.printf(2, y_offset, id(small_font), id(color_green), "${label_4}:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(sensor_4).state);

      if (id(batterylevel).has_state()) {
        int pct = (int) id(batterylevel).state;
        bool usb = id(usb_power_present).state;

        int bx = 4, by = 4, bw = 32, bh = 12;
        Color fill = (pct < 30) ? id(color_red) : id(color_green);

        it.rectangle(bx, by, bw, bh, Color::WHITE);                 // outline
        it.rectangle(bx + bw, by + bh / 3, 3, bh / 3, Color::WHITE); // terminal
        it.filled_rectangle(bx + 1, by + 1,
                             (bw - 2) * pct / 100,
                             bh - 2,
                             fill);

        it.printf(bx + bw + 6, by, id(tiny_font),
                  Color::WHITE, "%d%%", pct);

        if (usb)
          it.printf(bx + bw / 2 - 4, by - 10,
                    id(bolt_font), id(color_yellow), "⚡");
      }
