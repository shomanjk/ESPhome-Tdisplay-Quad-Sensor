# ESPHome: use current stable; last verified on 2026.3.1 (see README).
esphome:
  name: refrigerator-quad-temp-display
  friendly_name: Refrigerator Quad Temp Display

esp32:
  board: esp32dev
  framework:
    type: arduino

# Pin ADC component to ESPHome PR (deprecation / build fix); remove when merged.
external_components:
  - source: github://pr#7942
    refresh: 30s
    components:
      - adc

logger:
  level: WARN

# Enable Home Assistant API
api:

# OTA is required for Over-the-Air updating
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fallback_AP"

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Commenting out web server in case it causes more battery consumption
# web_server:
#   port: 80
#   include_internal: true

# Support for the Display pins
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

font:
  - file: "fonts/arial_11.bdf"
    id: tiny_font

  - file: "fonts/arial_16.bdf"
    id: small_font

  - file: "fonts/arial_24.bdf"
    id: medium_font

# Set global value for when the battery level was low
globals:
  - id: last_low_battery_time
    type: unsigned long
    restore_value: no
    initial_value: '0'

sensor:
  - platform: homeassistant
    name: "Main Fridge Temperature"
    entity_id: sensor.main_fridge_a290_temperature
    id: main_fridge_temp
    unit_of_measurement: 'F'

  - platform: homeassistant
    name: "Main Freezer Temperature"
    entity_id: sensor.main_freezer_temperature
    id: main_freezer_temp

  - platform: homeassistant
    name: "Kitchen Temperature"
    entity_id: sensor.kitchen_temperature
    id: kitchen_temp

  - platform: homeassistant
    entity_id: sensor.office_temperature
    id: office_temp
    unit_of_measurement: 'F'

  - platform: adc
    pin: GPIO34
    attenuation: auto
    name: VBatt
    id: vcc
    update_interval: 60s
    filters:
      - multiply: 2  # Adjust for the voltage divider 2.02695

  - platform: internal_temperature
    name: "Internal Temperature"
#    id: internal_temp
#    update_interval: 60s  #update the sensor every 60 seconds
#    on_value:
#      then:
#        - lambda:
#            ESP_LOGI("internal_temp", std::string::format("Temperature: %.2f°C", x).c_str());

  - platform: template
    name: "Lilygo T-Display Battery Level"
    id: batterylevel
    unit_of_measurement: '%'
    device_class: battery
    update_interval: 60s
    lambda: |-
      if (!id(vcc).has_state()) {
        return {};
      }

      float voltage = id(vcc).state;

      // Clamp USB-powered readings
      if (voltage > 4.2) voltage = 4.2;
      if (voltage < 3.0) voltage = 3.0;

      float percentage = 0.0;

      if (voltage >= 4.15) percentage = 100;
      else if (voltage >= 4.05) percentage = 90;
      else if (voltage >= 3.95) percentage = 80;
      else if (voltage >= 3.85) percentage = 70;
      else if (voltage >= 3.80) percentage = 60;
      else if (voltage >= 3.75) percentage = 50;
      else if (voltage >= 3.70) percentage = 40;
      else if (voltage >= 3.65) percentage = 30;
      else if (voltage >= 3.55) percentage = 20;
      else if (voltage >= 3.40) percentage = 10;
      else percentage = 5;

      // Do NOT sleep if USB is present
      if (!id(usb_power_present).state &&
          percentage < 30 &&
          id(last_low_battery_time) == 0) {
        id(last_low_battery_time) = millis();
        id(low_battery_script).execute();
      }

      return percentage;

# Define deep sleep configuration
deep_sleep:
  id: deep_sleep_config
#  sleep_duration:
#    seconds: 20
#  wakeup_pin: GPIO0  # Change this to the correct GPIO number for your board's button
#  wakeup_pin_mode: KEEP_AWAKE

# the wakeup pin seems to break this.  it won't go to sleep when it's configured.

# Script to delay and then enter deep sleep
script:
  - id: low_battery_script
    then:
      - delay: 3min  # Wait for 3 minutes
      - deep_sleep.enter: deep_sleep_config

# Define the GPIO pin for the onboard button
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO35  # Change this to the correct GPIO number for your board's button
      mode: INPUT
      inverted: true
    name: "Sleep Button 1"
#    id: onboard_button_1
    on_press:
      then:
        - deep_sleep.enter:
            id: deep_sleep_config
    internal: True

  - platform: template
    name: "USB Power Present"
    id: usb_power_present
    internal: true
    lambda: |-
      if (!id(vcc).has_state()) return false;

      // TTGO T-Display: VBAT jumps above 4.3V when USB is present
      return id(vcc).state > 4.3;

color:
  - id: color_green
    green: 100%

  - id: color_red
    red: 100%

  - id: color_yellow
    red: 100%
    green: 100%

display:
  - platform: st7789v
    model: TTGO TDisplay 135x240
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    backlight_pin: GPIO4
    rotation: 0

    lambda: |-
      it.fill(Color::BLACK);

      int y_offset = 18;  // Starting Y position
      int spacing = 57;   // Vertical spacing between entities
      int line_spacing = 1; // Additional space between the temperature value and the horizontal line

      it.printf(2, y_offset, id(small_font), id(color_green), "Main Fridge:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(main_fridge_temp).state);
      it.horizontal_line(0, y_offset + spacing + line_spacing, 240, Color::WHITE);

      y_offset += spacing;
      it.printf(2, y_offset, id(small_font), id(color_green), "Main Freezer:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(main_freezer_temp).state);
      it.horizontal_line(0, y_offset + spacing + line_spacing, 240, Color::WHITE);

      y_offset += spacing;
      it.printf(2, y_offset, id(small_font), id(color_green), "Kitchen:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(kitchen_temp).state);
      it.horizontal_line(0, y_offset + spacing + line_spacing, 240, Color::WHITE);

      y_offset += spacing;
      it.printf(2, y_offset, id(small_font), id(color_green), "Office:");
      it.printf(10, y_offset + 20, id(medium_font), Color::WHITE, "%.1f°F", id(office_temp).state);

      if (id(batterylevel).has_state()) {
        int pct = (int) id(batterylevel).state;
        bool usb = id(usb_power_present).state;

        int bx = 4, by = 4, bw = 32, bh = 12;
        Color fill = (pct < 30) ? id(color_red) : id(color_green);

        it.rectangle(bx, by, bw, bh, Color::WHITE);                 // outline
        it.rectangle(bx + bw, by + bh / 3, 3, bh / 3, Color::WHITE); // terminal
        it.filled_rectangle(bx + 1, by + 1,
                             (bw - 2) * pct / 100,
                             bh - 2,
                             fill);

        it.printf(bx + bw + 6, by, id(tiny_font),
                  Color::WHITE, "%d%%", pct);

        if (usb)
          it.printf(bx + bw / 2 - 4, by - 10,
                    id(tiny_font), id(color_yellow), "⚡");
      }
