name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'The version of the firmware to build (sets project.version)'
        required: true

jobs:
  # Inline build (not esphome/workflows reusable) so we can `cp secrets.yaml.example secrets.yaml`
  # before compile; core YAML uses !secret for Wi‑Fi.
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
      - name: Dummy secrets for CI
        run: cp secrets.yaml.example secrets.yaml
      - name: Firmware version
        id: version
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}"
          if [ -z "$VERSION" ]; then VERSION="dev-$(date +'%Y%m%d-%H%M')"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Inject project.version into factory YAML
        run: |
          # Keep project.name; replace project.version for this build
          sed -i 's/^\([[:space:]]*version:\).*/\1 "'"${{ steps.version.outputs.version }}"'"/' \
            lilygoT-Display-QuadSensor.factory.yaml
          grep -A2 'project:' lilygoT-Display-QuadSensor.factory.yaml
      - name: Build Firmware
        uses: esphome/build-action@v7.2.0
        id: esphome-build
        with:
          yaml-file: lilygoT-Display-QuadSensor.factory.yaml
          # Prebuilt firmware tracks current stable; config last verified on ESPHome 2026.7.3 (see README).
          version: stable
          complete-manifest: true
      - name: Stage versioned output
        run: |
          mkdir -p "output/${{ steps.version.outputs.version }}"
          mv "${{ steps.esphome-build.outputs.name }}"/* "output/${{ steps.version.outputs.version }}/"
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: firmware
          path: output

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
      - name: Build
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./static
          destination: ./output
      - name: Upload
        uses: actions/upload-artifact@v7.0.0
        with:
          name: site
          path: output

  publish:
    name: Publish to GitHub Pages
    # Deploy on push to main (and manual dispatch on main). GitHub Releases do not trigger this workflow.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs:
      - build-firmware
      - build-site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: firmware
          path: firmware

      - name: Copy firmware and manifest
        run: |-
          mkdir -p output/firmware
          cp -r firmware/${{ needs.build-firmware.outputs.version }}/* output/firmware/

      - uses: actions/download-artifact@v8.0.1
        with:
          name: site
          path: output

      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: output
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
